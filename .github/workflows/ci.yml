# GitHub Actions workflow.

name: CI

# # Run on push to a branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    # Training settings for the manual `train` job. Empty means the default.
    inputs:
      n_estimators:
        description: Number of trees (default 10)
        required: false
        default: ""
      max_depth:
        description: Maximum tree depth (default None)
        required: false
        default: ""

# Jobs run in parallel, unless a job lists another one under `needs`.
jobs:
  # Check the code style without running the code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `setup-uv` caches the downloaded packages by default.
      # Set `enable-cache: false` to compare run times without it.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  # Run the tests, once per Python version.
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest tests/ -v

  # Train the model. Only runs when you press the `run workflow` button.
  train:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      N_ESTIMATORS: ${{ inputs.n_estimators }}
      MAX_DEPTH: ${{ inputs.max_depth }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run python -m ci_cd.train
      # Keep the trained model, so you can download it from the run's page.
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: model/
          retention-days: 30
