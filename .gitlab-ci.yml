# GitLab CI/CD pipeline.

# Run on push to a branch.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

# Stages run one after the other. Jobs in the same stage run in parallel.
stages:
  - lint
  - test
  - train

# Only silence warnings in the job log.
variables:
  PIP_ROOT_USER_ACTION: ignore
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

# Shared settings.
default:
  image: python:3.12
  # Reuse the downloaded packages between jobs and pipelines.
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - pip install uv
    - uv sync --locked

# Check the code style without running the code.
lint:
  stage: lint
  script:
    - uv run ruff format --check .
    - uv run ruff check .

# Run the tests, once per Python version.
test:
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13", "3.14"]
  script:
    - uv run pytest tests/ -v

# Train the model. Runs by itself on `main` when `src/` changed, otherwise
# it waits for the `run` button. Set N_ESTIMATORS and MAX_DEPTH as variables
# when you start it to change the settings.
train:
  stage: train
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
      when: on_success
    - when: manual
  script:
    - uv run python -m ci_cd.train
  # Keep the trained model, so you can download it from the job page.
  artifacts:
    paths:
      - model/
    expire_in: 1 month
